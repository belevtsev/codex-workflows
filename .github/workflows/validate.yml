name: Validate portable workflow suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Validate obsolete PR heads only once. Main commits each produce a release.
concurrency:
  group: workflow-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Native Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GOWORK: 'off'
      GOFLAGS: '-mod=mod'
      TMPDIR: /tmp
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go with dependency cache
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Run native tests and race checks
        run: go test -race -count=1 ./...
      - name: Vet native implementation
        run: go vet ./...
      - name: Validate maintained source
        run: go run ./cmd/cw validate --source "$GITHUB_WORKSPACE"
      - name: Smoke native launcher
        run: scripts/native-smoke.sh
      - name: Test release publication with offline fixtures
        if: runner.os == 'Linux'
        run: scripts/test-publish-release.sh

  release:
    name: Publish native release for main commit
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GOWORK: 'off'
      GOFLAGS: '-mod=mod'
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build four reproducible binaries and checksums
        env:
          VERSION: v1.0.${{ github.run_number }}
          REVISION: ${{ github.sha }}
        run: scripts/build-release.sh
      - name: Publish or reconcile the exact release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v1.0.${{ github.run_number }}
          REVISION: ${{ github.sha }}
        run: scripts/publish-release.sh
