name: Validate portable workflow suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Validate obsolete PR heads only once. Main commits each produce a release.
concurrency:
  group: workflow-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Native Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GOWORK: 'off'
      GOFLAGS: '-mod=mod'
      TMPDIR: /tmp
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go with dependency cache
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build developer automation once
        run: exec go build -mod=mod -trimpath -o .bin/cwdev ./cmd/cwdev
      - name: Verify native implementation and prepare main release in parallel
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Linux' && format('v1.0.{0}', github.run_number) || '' }}
          SOURCE_REVISION: ${{ github.sha }}
        run: exec .bin/cwdev check --race --source . --revision "$SOURCE_REVISION" --release-version "$RELEASE_VERSION"
      - name: Retain exact validated release archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cw-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  release:
    name: Publish native release for main commit
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GOWORK: 'off'
      GOFLAGS: '-mod=mod'
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download this run's exact validated archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cw-release-${{ github.sha }}
          path: dist/
      - name: Publish or reconcile the exact release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v1.0.${{ github.run_number }}
          REVISION: ${{ github.sha }}
        run: exec go run ./cmd/cwdev release publish --source . --version "$VERSION" --revision "$REVISION" --dist dist
