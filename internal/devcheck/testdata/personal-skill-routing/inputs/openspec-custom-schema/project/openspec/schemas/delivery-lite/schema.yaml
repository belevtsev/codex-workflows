name: delivery-lite
version: 1
description: Delivery planning without a delta-spec artifact
artifacts:
  - id: proposal
    generates: proposal.md
    description: Requested outcome and boundaries
    template: proposal.md
    instruction: Explain the problem, requested behavior, and affected component.
    requires: []
  - id: notes
    generates: review/notes.md
    description: Engineering decisions
    template: notes.md
    instruction: Record the chosen behavior, constraints, failure paths, and rollback.
    requires:
      - proposal
  - id: tasks
    generates: execution/tasks.md
    description: Ordered work and acceptance gates
    template: tasks.md
    instruction: List implementation and validation work using unchecked checkboxes.
    requires:
      - notes
  - id: rollout-observations
    generates: rollout-observations.md
    description: Optional observations collected during a later release
    template: rollout-observations.md
    instruction: Record observed release evidence only when supplied.
    requires:
      - proposal
apply:
  requires:
    - tasks
  tracks: execution/tasks.md
  instruction: Implement the work listed in execution/tasks.md.
